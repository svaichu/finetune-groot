# GR00T-N1.7 fine-tune run definition: model half + training half.
#
# Loaded by finetune_groot/run_finetune.py (`finetune-groot`) through training_cfgs.Config, which gives
# every key below a typed `--<group>.<field>` CLI override for free. The group
# names are organisational only -- Config.flatten() renders bare kebab-case
# flags, so each field name must match a FinetuneConfig field
# (vendor/Isaac-GR00T/gr00t/configs/finetune_config.py).

model:
  base_model_path: nvidia/GR00T-N1.7-3B
  embodiment_tag: NEW_EMBODIMENT
  modality_config_path: /home/yn030245/finetune-groot/finetune_groot/embodiment_config.py
  tune_llm: false
  tune_visual: false
  tune_projector: true
  tune_diffusion_model: true

training:
  dataset_path: /hpcwork/yn030245/gr00t-ft/data/stack_without_ft_tact_v4
  output_dir: /hpcwork/yn030245/gr00t-ft/checkpoints
  global_batch_size: 32
  dataloader_num_workers: 4
  learning_rate: 1.0e-4
  gradient_accumulation_steps: 1
  max_steps: 10000
  warmup_ratio: 0.05
  save_steps: 1000
  save_total_limit: 5
  num_gpus: 1
  use_wandb: true
  wandb_project: finetune-gr00t-stack-tact
  experiment_name: stack_tact_v4_n1p7
