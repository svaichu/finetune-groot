# Config for finetune_minimal.ipynb -- the notebook reads every hyperparameter,
# path and split from here via training_cfgs.Config.from_file(); nothing is
# hardcoded in the notebook itself. Calibration-scale values (200 steps,
# batch 8) live here, separate from configs/finetune.yaml which holds the
# full-run values for scripts/run_finetune.py. Field names mirror
# finetune.yaml (HF Trainer / FinetuneConfig naming) wherever they overlap.

model:
  base_model_path: nvidia/GR00T-N1.7-3B
  embodiment_tag: NEW_EMBODIMENT
  modality_config_path: /home/yn030245/finetune-groot/embodiment_config.py
  tune_llm: false
  tune_visual: false
  tune_projector: true
  tune_diffusion_model: true
  load_bf16: true

data:
  val_episodes: [46, 47, 48, 49, 50]  # fixed held-out split; all other episodes train

training:
  dataset_path: /hpcwork/yn030245/gr00t-ft/data/stack_without_ft_tact_v4
  output_dir: /hpcwork/yn030245/gr00t-ft/checkpoints
  experiment_name: notebook_run  # checkpoints land in <output_dir>/<experiment_name>/
  global_batch_size: 8
  learning_rate: 1.0e-4
  max_steps: 200
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  save_steps: 100
  logging_steps: 10
  use_wandb: true
  wandb_project: finetune-gr00t-stack-tact
