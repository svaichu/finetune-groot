# robotdataset dataset info, edited. LSY-lab/stack_without_ft_tact_v4 (51 episodes, 15 fps, one task).
#   use:   true on every modality the model should get (all start as false)
#   order: the order of this list is the order handed to the model
#   name:  the model-side group name (defaults to the shortest unique path suffix)
#   role:  optional override of the role implied by kind (video | state | action | language)
#   split: optional, cuts one vector leaf into named groups: [{name: eef, columns: [0, 6]}, ...]
# kind/dtype/shape describe the data; they are checked against the loader when the file is loaded.
dataset:
  loader: LeRobotVideoDataset
  kwargs: {local_path: /hpcwork/yn030245/gr00t-ft/data/stack_without_ft_tact_v4}
  episodes_loaded: 3
  steps_loaded: 725
  fps: 15.0
modalities:
  - {path: observation/images/primary, kind: image, dtype: uint8, shape: [256, 256, 3], use: true, name: primary}
  - {path: observation/images/wrist, kind: image, dtype: uint8, shape: [256, 256, 3], use: true, name: wrist}
  - {path: observation/state/cartesian, kind: state, dtype: float32, shape: [6], use: true, name: cartesian}
  - {path: observation/state/gripper, kind: state, dtype: float32, shape: [1], use: true, name: gripper}
  - {path: observation/state/joints, kind: state, dtype: float32, shape: [7], use: true, name: joints}
  - {path: observation/state/target, kind: state, dtype: float32, shape: [6], use: true, name: target}
  - {path: action, kind: action, dtype: float32, shape: [7], use: true, name: action, split: [{name: eef, columns: [0, 6]}, {name: gripper, columns: [6, 7]}]}
  - {path: observation/language_instruction, kind: text, dtype: string, shape: [], use: true, name: language_instruction}
  - {path: observation/state/all, kind: state, dtype: float32, shape: [20], use: false, name: all}
# Isaac-GR00T settings (read by Gr00tAdapter).
#   action_horizon: action delta_indices are 0 .. horizon-1
#   video_delta / state_delta: step offsets relative to the anchor
#   language: default instruction when no text modality is selected; modality_key is the name GR00T looks it up under
#   action: per action group {rep: ABSOLUTE|RELATIVE|DELTA, type: EEF|NON_EEF, format: DEFAULT|XYZ_ROT6D|XYZ_ROTVEC,
#           state_key: <state group name, required for RELATIVE>}; a group left out is ABSOLUTE / NON_EEF / DEFAULT
gr00t:
  action_horizon: 16  # 16 steps at 15 fps = ~1.07 s, GR00T's standard action chunk
  video_delta: [0]
  state_delta: [0]
  language:
    default: null  # the instruction comes from observation/language_instruction
    modality_key: annotation.human.task_description
  action:
    # EEF (columns 0:6, x y z + rotation vector) is a RELATIVE command: action[t] matches the state delta
    # cartesian[t+1] - cartesian[t]. ActionFormat.DEFAULT would need a 4x4 matrix and XYZ_ROT6D 9 values; of the
    # 6-vector formats only XYZ_ROTVEC fits. The columns are Euler-like, but per-step deltas are tiny (max ~3.2
    # degrees), where rotation vector and Euler difference agree to first order.
    eef: {rep: RELATIVE, type: EEF, format: XYZ_ROTVEC, state_key: cartesian}
    # the gripper (column 6) is ABSOLUTE and continuous in [0, 0.999]
    gripper: {rep: ABSOLUTE, type: NON_EEF, format: DEFAULT, state_key: gripper}
