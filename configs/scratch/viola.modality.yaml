# robotdataset dataset info, edited. Open X-Embodiment `viola` (Franka, 224x224 RGB). terminate_episode, ee_states and the language embedding are not used.
#   use:   true on every modality the model should get (all start as false)
#   order: the order of this list is the order handed to the model
#   name:  the model-side group name (defaults to the shortest unique path suffix)
#   role:  optional override of the role implied by kind (video | state | action | language)
#   split: optional, cuts one vector leaf into named groups: [{name: eef, columns: [0, 6]}, ...]
# kind/dtype/shape describe the data; they are checked against the loader when the file is loaded.
dataset:
  loader: OXEDataset
  kwargs: {dataset_name: viola, load_str_fields: true}
  episodes_loaded: 8
  steps_loaded: 3841
modalities:
  - {path: observation/agentview_rgb, kind: image, dtype: uint8, shape: [224, 224, 3], use: true, name: agentview_rgb}
  - {path: observation/eye_in_hand_rgb, kind: image, dtype: uint8, shape: [224, 224, 3], use: true, name: eye_in_hand_rgb}
  - {path: observation/joint_states, kind: state, dtype: float32, shape: [7], use: true, name: joint_states}
  - {path: observation/gripper_states, kind: state, dtype: float32, shape: [1], use: true, name: gripper_states}
  - {path: observation/natural_language_instruction, kind: text, dtype: string, shape: [], use: true, name: natural_language_instruction}
  - {path: action/world_vector, kind: action, dtype: float32, shape: [3], use: true, name: world_vector}
  - {path: action/rotation_delta, kind: action, dtype: float32, shape: [3], use: true, name: rotation_delta}
  - {path: action/gripper_closedness_action, kind: action, dtype: float32, shape: [], use: true, name: gripper_closedness_action}
  - {path: observation/natural_language_embedding, kind: text, dtype: float32, shape: [512], use: false, name: natural_language_embedding}
  - {path: observation/ee_states, kind: state, dtype: float32, shape: [16], use: false, name: ee_states}
  - {path: action/terminate_episode, kind: action, dtype: float32, shape: [], use: false, name: terminate_episode}
# Isaac-GR00T settings (read by Gr00tAdapter).
#   action_horizon: action delta_indices are 0 .. horizon-1
#   video_delta / state_delta: step offsets relative to the anchor
#   language: default instruction when no text modality is selected; modality_key is the name GR00T looks it up under
#   action: per action group {rep: ABSOLUTE|RELATIVE|DELTA, type: EEF|NON_EEF, format: DEFAULT|XYZ_ROT6D|XYZ_ROTVEC,
#           state_key: <state group name, required for RELATIVE>}; a group left out is ABSOLUTE / NON_EEF / DEFAULT
gr00t:
  action_horizon: 16
  video_delta: [0]
  state_delta: [0]
  language:
    default: null  # the instruction comes from observation/natural_language_instruction
    modality_key: annotation.human.task_description
  action: {}  # viola's actions are per-step delta commands; the model predicts them as they are (ABSOLUTE / NON_EEF)
