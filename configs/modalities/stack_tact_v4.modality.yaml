# robotdataset dataset info (generated). Edit it, then load it with a model adapter.
#
#   use    true on every modality the model should get (all start as false)
#   order  the order of this list is the order handed to the model
#   name   the model-side group name (defaults to the shortest unique path suffix)
#   role   optional override of the role implied by kind: video | state | action | language
#   split  optional, cuts one vector leaf into named groups: [{name: eef, columns: [0, 6]}, ...]
#
# kind, dtype and shape describe the data; they are checked against the loader when the file is loaded.
dataset:
  loader: LeRobotVideoDataset
  kwargs: {repo_id: LSY-lab/stack_without_ft_tact_v4}
  episodes_loaded: 18
  steps_loaded: 4244
  fps: 15.0

modalities:
  - {use: false, path: observation/images/primary,       kind: image,  dtype: uint8,   shape: [256, 256, 3], name: primary}
  - {use: true,  path: observation/images/wrist,         kind: image,  dtype: uint8,   shape: [256, 256, 3], name: wrist}

  - {use: false, path: observation/state/cartesian,      kind: state,  dtype: float32, shape: [6],           name: cartesian}
  - {use: true,  path: observation/state/gripper,        kind: state,  dtype: float32, shape: [1],           name: gripper}
  - {use: true,  path: observation/state/joints,         kind: state,  dtype: float32, shape: [7],           name: joints}
  - {use: false, path: observation/state/target,         kind: state,  dtype: float32, shape: [6],           name: target}
  - {use: false, path: observation/state/all,            kind: state,  dtype: float32, shape: [20],          name: all}

  - {use: true,  path: action,                           kind: action, dtype: float32, shape: [7],           name: action}

  - {use: true,  path: observation/language_instruction, kind: text,   dtype: string,  shape: [],            name: language_instruction}

# Isaac-GR00T settings (read by Gr00tAdapter).
gr00t:
  action_horizon: 16  # action delta_indices are 0 .. horizon-1
  video_delta: [0]    # step offsets of the video frames relative to the anchor step
  state_delta: [0]    # step offsets of the state relative to the anchor step
  language:
    default: null                                    # instruction used when no text modality is selected
    modality_key: annotation.human.task_description  # the name GR00T looks the instruction up under
  action: {}  # per action group; a group left out is ABSOLUTE / NON_EEF / DEFAULT
  # to set a group, replace the {} above with entries named after a modality or split, e.g.:
  #   eef:     {rep: RELATIVE, type: EEF, format: XYZ_ROTVEC, state_key: cartesian}
  #   gripper: {rep: ABSOLUTE, type: NON_EEF}
  # rep: ABSOLUTE | RELATIVE | DELTA     type: EEF | NON_EEF     format: DEFAULT | XYZ_ROT6D | XYZ_ROTVEC
  # state_key: name of a selected state group (a whole state leaf); required for RELATIVE
