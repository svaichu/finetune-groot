# robotdataset dataset info for ElRobot (Station / norma-core), hand-written to match
# inference-client's DATA_FORMAT.md and dataset-cheese1.parquet -- not generated by
# `python -m robotdataset.info`, since StationParquetDataset is new and small (8 joints,
# 3 cameras, one flat state/action vector each, no EEF/gripper split).
#
#   use    true on every modality the model should get (all start as false)
#   order  the order of this list is the order handed to the model
#   name   the model-side group name (defaults to the shortest unique path suffix)
#   role   optional override of the role implied by kind: video | state | action | language
#   split  optional, cuts one vector leaf into named groups: [{name: eef, columns: [0, 6]}, ...]
#
# State = each joint's position_norm, action = its goal_norm ([0,1]); camera names cam0..2 and the language key
# "task" are the literal names inference-client's StationFrame.to_observation() sends.
#
# kind, dtype and shape describe the data; they are checked against the loader when the file is loaded.
dataset:
  loader: StationParquetDataset
  kwargs: {data_dir: /workspace/finetune-groot/outputs/elrobot_data}  # one .parquet file per episode (Station dataset-generator output)
  episodes_loaded: 1
  steps_loaded: 408
  fps: 10.0

modalities:
  - {use: true, path: observation/images/cam0, kind: image, dtype: uint8,   shape: [224, 224, 3], name: cam0}
  - {use: true, path: observation/images/cam1, kind: image, dtype: uint8,   shape: [224, 224, 3], name: cam1}
  - {use: true, path: observation/images/cam2, kind: image, dtype: uint8,   shape: [224, 224, 3], name: cam2}

  - {use: true, path: observation/state,       kind: state, dtype: float32, shape: [8],           name: state}

  - {use: true, path: action,                  kind: action, dtype: float32, shape: [8],           name: action}

  - {use: true, path: observation/language_instruction, kind: text, dtype: string, shape: [], name: language_instruction}

# Isaac-GR00T settings (read by Gr00tAdapter).
gr00t:
  action_horizon: 16  # action delta_indices are 0 .. horizon-1 (~1.6s at this dataset's ~10 fps)
  video_delta: [0]    # step offsets of the video frames relative to the anchor step
  state_delta: [0]    # step offsets of the state relative to the anchor step
  language:
    default: null       # language_instruction is selected above, so no static fallback is needed
    modality_key: task   # literal key StationFrame.to_observation() builds: observation["language"]["task"]
  action: {}  # the single "action" group is ABSOLUTE / NON_EEF / DEFAULT (goal_norm, not a delta; checked on dataset-cheese1.parquet, RMSE(goal[t], pos[t+1]) ~ RMSE(goal[t], pos[t]), so neither delta framing is clearly better)
  # to set a group, replace the {} above with entries named after a modality or split, e.g.:
  #   eef:     {rep: RELATIVE, type: EEF, format: XYZ_ROTVEC, state_key: cartesian}
  #   gripper: {rep: ABSOLUTE, type: NON_EEF}
  # rep: ABSOLUTE | RELATIVE | DELTA     type: EEF | NON_EEF     format: DEFAULT | XYZ_ROT6D | XYZ_ROTVEC
  # state_key: name of a selected state group (a whole state leaf); required for RELATIVE
