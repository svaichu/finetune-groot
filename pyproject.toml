[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finetune-groot"
version = "0.1.0"
description = "GR00T-N1.7 fine-tuning on LSY-lab/stack_without_ft_tact_v4 via robotdataset + training_cfgs."
authors = [
    { name = "Vaishnavahari Seenivasan", email = "vaishnavahari.seenivasan@rwth-aachen.de" }
]
license = "MIT"
readme = "README.md"

# Dictated by vendor/Isaac-GR00T: the N1.7 release pins requires-python = "==3.10.*".
# Do not widen this without re-reading vendor/Isaac-GR00T/pyproject.toml first --
# a mismatch here is what broke the previous environment.
requires-python = "==3.10.*"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Only what this repo imports directly. Every heavy pin -- torch, torchvision,
# torchcodec, transformers, numpy, pandas, wandb, matplotlib, huggingface_hub,
# flash-attn -- is declared by the vendored gr00t package, so there is exactly
# one source of truth for them and no second list to keep in sync.
dependencies = [
    "gr00t",                    # vendored at vendor/Isaac-GR00T (not on PyPI)
    "robotdataset[hf,oxe]>=0.4.0",  # see [tool.uv.sources] note below; oxe = tensorflow + tfds for OXEDataset
    "training-cfgs>=0.2.1",     # Config.flatten()/to_argv(), used by run_finetune
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
finetune-groot = "finetune_groot.run_finetune:main"

[tool.uv.sources]
gr00t = { path = "vendor/Isaac-GR00T", editable = true }

# robotdataset 0.4.0 (dataset info, model adapters, relative-action stats) is not on PyPI yet,
# so it is consumed from a sibling checkout: <parent>/robotdataset next to this repo.
# Delete this line once 0.4.0 is published and `pip install` alone will suffice.
robotdataset = { path = "../robotdataset", editable = true }

# flash-attn is on PyPI, but sdist-only -- it has never published a binary wheel
# for any version. A plain resolve therefore compiles the CUDA kernels from
# source (~1 h, needs nvcc and torch present at build time). Dao-AILab ships
# prebuilt wheels as GitHub release assets instead, keyed by cpython/torch/cuda/abi;
# this is the one vendor/Isaac-GR00T itself selects for cp310 + torch 2.7 + x86_64.
# It is only a uv hint -- the pin (2.7.4.post1) still comes from gr00t.
# Pre-Ampere GPUs (e.g. Colab T4, sm75) cannot run it: set
# `use_flash_attention: false` in the model config and gr00t falls back to sdpa.
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.7cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }

[tool.setuptools.packages.find]
include = ["finetune_groot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
